<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMIS 360 Video Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    a-scene { width: 100%; height: 700px; } 
    .container-fluid{
      padding: 0px;
    }
  </style>
</head>
<body>
  <header class="container-fluid">
    <img src="assets/images/cmis_header.png" alt="CMIS Header" class="img-fluid"/>
  </header>

<section>
  <a-scene embedded>
    <a-assets>
      <video id="video360" autoplay loop playsinline muted src="assets/images/insta_video.mp4" crossorigin="anonymous"></video>
    </a-assets>

    <a-videosphere src="#video360"></a-videosphere>
    <a-entity camera look-controls="enabled: true; touchEnabled: true; magicWindowTrackingEnabled: false"></a-entity>
  </a-scene>
</section>

  <footer class="container-fluid">
    <img src="assets/images/cmis_footer.png" alt="CMIS Footer" class="img-fluid"/>
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const video = document.querySelector('#video360');
    video.play().catch(() => {
      console.log('Autoplay blocked, waiting for user interaction');
      document.body.addEventListener('click', () => video.play());
    });
  });
</script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
